name: Build firmware

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENBK_REPO: openshwprojects/OpenBK7231T_App
  OPENBK_SHA: 168cba55ea932b2393c86ebf9eeb1f5e665396d7
  OPENLN882H_SHA: 84149f251efc120561bdefa17ce399f62eadb8be

jobs:
  build:
    name: Build PowerSocket
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Checkout OpenBK7231T_App
        uses: actions/checkout@v5
        with:
          repository: ${{ env.OPENBK_REPO }}
          ref: ${{ env.OPENBK_SHA }}
          path: OpenBK7231T_App

      - name: Checkout OpenLN882H SDK
        run: |
          git -C OpenBK7231T_App submodule update --init sdk/OpenLN882H
          test "$(git -C OpenBK7231T_App rev-parse HEAD)" = "${OPENBK_SHA}"
          test "$(git -C OpenBK7231T_App/sdk/OpenLN882H rev-parse HEAD)" = "${OPENLN882H_SHA}"

      - name: Install Arm GNU Toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '10.3-2021.10'
          path-env-var: ARM_NONE_EABI_GCC_PATH

      - name: Build PowerSocket
        run: |
          export CROSS_TOOLCHAIN_ROOT="$(dirname "$ARM_NONE_EABI_GCC_PATH")"
          chmod +x build_power_socket.sh
          ./build_power_socket.sh

      - name: Create checksums
        working-directory: ln882h_power_socket/output
        run: |
          test -s flashimage.bin
          test -s flashimage-ota-xz-v0.1.bin
          sha256sum flashimage.bin flashimage-ota-xz-v0.1.bin > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v6
        with:
          name: PowerSocket-${{ github.sha }}
          path: |
            ln882h_power_socket/output/flashimage.bin
            ln882h_power_socket/output/flashimage-ota-xz-v0.1.bin
            ln882h_power_socket/output/SHA256SUMS.txt
            build_power_socket/bin/PowerSocket.elf
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ln882h_power_socket/output/flashimage.bin
            ln882h_power_socket/output/flashimage-ota-xz-v0.1.bin
            ln882h_power_socket/output/SHA256SUMS.txt
          fail_on_unmatched_files: true
